name: Release All Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Tag (e.g. v1.5.0)'
        required: false
        default: 'v1.5.0'
  push:
    tags: ['v*']

jobs:

  # ─── WINDOWS EXE ───────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install flask pywebview yt-dlp static-ffmpeg pyinstaller pillow

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --windowed --onefile `
            --name "YT-Downloader" `
            --icon app.ico `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --hidden-import yt_dlp `
            --hidden-import webview `
            --hidden-import flask `
            --collect-all static_ffmpeg `
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/YT-Downloader.exe

  # ─── LINUX DEB ──────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            gir1.2-webkit2-4.0 \
            gir1.2-gtk-3.0 \
            python3-gi \
            python3-gi-cairo \
            dpkg-dev

      - name: Install Python deps
        run: |
          pip install --system-site-packages flask pywebview yt-dlp static-ffmpeg pyinstaller pillow platformdirs importlib_resources jaraco.text || pip install flask pywebview yt-dlp static-ffmpeg pyinstaller pillow platformdirs importlib_resources jaraco.text

      - name: Build binary
        run: |
          pyinstaller --noconfirm --onefile \
            --name "yt-downloader" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --hidden-import yt_dlp \
            --hidden-import webview \
            --hidden-import flask \
            --collect-all static_ffmpeg \
            --collect-all gi \
            --collect-all cairo \
            --collect-all platformdirs \
            --collect-all importlib_resources \
            --collect-all jaraco.text \
            --collect-all jaraco.functools \
            --collect-all jaraco.context \
            --collect-all more_itertools \
            --collect-all packaging \
            main.py

      - name: Package .deb
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/share/applications
          mkdir -p pkg/usr/share/pixmaps
          cp dist/yt-downloader pkg/usr/bin/yt-downloader
          cp docs/assets/logo.png pkg/usr/share/pixmaps/yt-downloader.png
          chmod +x pkg/usr/bin/yt-downloader
          cat > pkg/DEBIAN/control << CTRL
          Package: yt-downloader
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Mostafa Kamal <mostafakamal.cse2022@github.com>
          Depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
          Description: Free YouTube Downloader
           Open-source YouTube downloader GUI. Powered by yt-dlp. No ads.
          CTRL
          cat > pkg/usr/share/applications/yt-downloader.desktop << DESK
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=YT Downloader
          Comment=Free YouTube video downloader
          Exec=/usr/bin/yt-downloader
          Icon=yt-downloader
          Terminal=false
          Categories=Utility;Network;
          DESK
          dpkg-deb --build pkg yt-downloader-${VERSION}-amd64.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: yt-downloader-*.deb

  # ─── MACOS DMG ───────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install flask pywebview yt-dlp static-ffmpeg pyinstaller pillow
          brew install create-dmg

      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed --onedir \
            --name "YT Downloader" \
            --icon YTDownloader.icns \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --hidden-import yt_dlp \
            --hidden-import webview \
            --hidden-import flask \
            --collect-all static_ffmpeg \
            main.py
          codesign --force --deep --sign - "dist/YT Downloader.app"

      - name: Build DMG
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          create-dmg \
            --volname "YT Downloader" \
            --window-size 660 400 \
            --icon-size 120 \
            --app-drop-link 480 170 \
            "YT-Downloader-${TAG}.dmg" \
            "dist/YT Downloader.app" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: YT-Downloader-*.dmg

  # ─── CREATE GITHUB RELEASE ──────────────────────────────────────────
  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "YT Downloader ${{ inputs.version || github.ref_name }}"
          body: |
            ## YT Downloader ${{ inputs.version || github.ref_name }}

            ### 📥 Downloads
            | Platform | File | Install |
            |---|---|---|
            | 🪟 Windows 10/11 | `YT-Downloader.exe` | Run directly |
            | 🐧 Linux (Ubuntu/Debian) | `yt-downloader-amd64.deb` | `sudo dpkg -i *.deb` |
            | 🍎 macOS 12+ | `YT-Downloader.dmg` | Open DMG → drag to Apps |

            ### ✨ What's New in ${{ inputs.version || github.ref_name }}
            - Cross-platform support across macOS, Linux, and Windows for desktop app and website
            - Full bundling of static FFmpeg for audio/video merging and extraction on all platforms
            - Apple Silicon (M1/M2/M3/M4) native codesign support
            - Automatic audio and video merging in Best & Suggested quality
            - 8K, 4K, 1080p, and audio extraction support
            - Cross-platform native folder pickers and openers
            - High-resolution application icons for Windows (.exe), macOS (.dmg), and Linux (.deb launcher)

            ### 📖 First Launch (macOS Apple Silicon M1/M2/M3/M4 & Intel)
            If macOS says *"YT Downloader is damaged and can't be opened"* or blocks the app:
            1. Open **Terminal** and run:
               ```bash
               xattr -cr "/Applications/YT Downloader.app"
               ```
            2. Or go to **System Settings** → **Privacy & Security** → scroll to **Security** → click **Open Anyway**.
            3. Or right-click **YT Downloader.app** → click **Open** → click **Open**.

            ### 🛠 Run From Source
            ```bash
            git clone https://github.com/mostafa-cse/youtube-downloader.git
            cd youtube-downloader
            python3 -m venv venv
            venv/bin/pip install flask yt-dlp pywebview static-ffmpeg Pillow
            venv/bin/python main.py
            ```
          files: |
            windows-exe/YT-Downloader.exe
            linux-deb/yt-downloader-*.deb
            macos-dmg/YT-Downloader-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
